[project]
name = "oss-fuzz-rl"
version = "0.1.0"
description = "RL task generator and reward scorer for OSS-Fuzz harness-writing agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oss-fuzz-rl = "oss_fuzz_rl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
